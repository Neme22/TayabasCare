<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TayabasCare – Email Template Preview</title>
    <style>
        body { margin: 0; padding: 20px; background: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        h1 { text-align: center; color: #1e293b; margin-bottom: 8px; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 32px; }
        .email-frame { max-width: 660px; margin: 0 auto 40px auto; }
        .email-label { font-size: 14px; font-weight: 700; color: #1e40af; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .email-label.red { color: #dc2626; }
        .email-label.gold { color: #f59e0b; }
        iframe { width: 100%; border: 1px solid #cbd5e1; border-radius: 12px; background: #fff; }
    </style>
</head>
<body>

<h1>TayabasCare – Email Template Preview</h1>
<p class="subtitle">All 6 email types rendered with sample data</p>

<!-- 1. Password Reset OTP -->
<div class="email-frame">
    <div class="email-label">1. Password Reset OTP</div>
    <iframe id="email1" style="height:520px;" scrolling="yes"></iframe>
</div>

<!-- 2. New Schedule Assigned -->
<div class="email-frame">
    <div class="email-label">2. New Inspection Schedule Assigned</div>
    <iframe id="email2" style="height:480px;" scrolling="yes"></iframe>
</div>

<!-- 3. Schedule Changed -->
<div class="email-frame">
    <div class="email-label gold">3. Schedule Updated (Reschedule)</div>
    <iframe id="email3" style="height:480px;" scrolling="yes"></iframe>
</div>

<!-- 4. Day-Before Inspection Reminder -->
<div class="email-frame">
    <div class="email-label">4. Inspection Reminder (Tomorrow)</div>
    <iframe id="email4" style="height:500px;" scrolling="yes"></iframe>
</div>

<!-- 5. Daily Compliance Alert -->
<div class="email-frame">
    <div class="email-label red">5. Daily Compliance Alert</div>
    <iframe id="email5" style="height:620px;" scrolling="yes"></iframe>
</div>

<!-- 6. Overdue Follow-up -->
<div class="email-frame">
    <div class="email-label red">6. Overdue Compliance Follow-up</div>
    <iframe id="email6" style="height:520px;" scrolling="yes"></iframe>
</div>

<script>
// Shared email template renderer (mirrors php/email_template.php)
function renderEmailTemplate(title, content, accentColor = '#1e40af') {
    const year = new Date().getFullYear();
    return `<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body style="margin:0;padding:0;background-color:#f1f5f9;font-family:'Segoe UI',Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f1f5f9;">
    <tr><td align="center" style="padding:32px 16px;">
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 6px rgba(0,0,0,0.07);">
            <tr><td style="background-color:#1e40af;padding:28px 40px;text-align:center;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
                    <span style="font-size:26px;font-weight:700;color:#ffffff;letter-spacing:0.5px;">TayabasCare</span><br>
                    <span style="font-size:13px;color:#93c5fd;letter-spacing:0.3px;">City Health Office &bull; Tayabas City</span>
                </td></tr></table>
            </td></tr>
            <tr><td style="height:4px;background-color:${accentColor};"></td></tr>
            <tr><td style="padding:32px 40px 0 40px;">
                <h1 style="margin:0;font-size:20px;font-weight:700;color:#1e293b;line-height:1.3;">${title}</h1>
            </td></tr>
            <tr><td style="padding:16px 40px 0 40px;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td style="border-bottom:1px solid #e2e8f0;"></td></tr></table></td></tr>
            <tr><td style="padding:24px 40px 32px 40px;font-size:15px;line-height:1.7;color:#334155;">${content}</td></tr>
        </table>
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">
            <tr><td style="padding:20px 40px;text-align:center;">
                <p style="margin:0 0 6px 0;font-size:12px;color:#94a3b8;">City Health Office &bull; Tayabas City, Quezon Province</p>
                <p style="margin:0;font-size:12px;color:#cbd5e1;">This is an automated message from the TayabasCare System. Please do not reply directly to this email.</p>
                <p style="margin:8px 0 0 0;font-size:11px;color:#cbd5e1;">&copy; ${year} TayabasCare. All rights reserved.</p>
            </td></tr>
        </table>
    </td></tr>
</table>
</body></html>`;
}

function infoRow(label, value) {
    return `<tr><td style="padding:6px 0;font-size:14px;color:#64748b;white-space:nowrap;padding-right:16px;vertical-align:top;width:120px;">${label}:</td><td style="padding:6px 0;font-size:14px;color:#1e293b;font-weight:600;">${value}</td></tr>`;
}

function listItem(text) {
    return `<tr><td style="padding:5px 0;font-size:14px;color:#334155;padding-left:8px;"><span style="color:#1e40af;margin-right:8px;">&#9679;</span> ${text}</td></tr>`;
}

// ─── Email 1: Password Reset OTP ───
document.getElementById('email1').srcdoc = renderEmailTemplate('Password Reset OTP',
    `<p style="margin:0 0 16px 0;">Hello <strong>admin</strong>,</p>
     <p style="margin:0 0 24px 0;">We received a request to reset your TayabasCare password. Use the One-Time Password below to proceed:</p>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 24px 0;">
         <tr><td align="center" style="padding:20px 0;">
             <div style="display:inline-block;background-color:#f1f5f9;border:2px dashed #3b82f6;border-radius:10px;padding:16px 40px;">
                 <span style="font-size:32px;font-weight:700;color:#1e40af;letter-spacing:6px;font-family:Consolas,'Courier New',monospace;">482917</span>
             </div>
         </td></tr></table>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 16px 0;">
         <tr><td style="background-color:#fef3c7;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:0 6px 6px 0;font-size:14px;color:#92400e;">
             &#9200; This OTP is valid for <strong>10 minutes</strong>. Do not share it with anyone.
         </td></tr></table>
     <p style="margin:0;font-size:13px;color:#94a3b8;">If you did not request a password reset, you can safely ignore this email. Your password will remain unchanged.</p>`,
    '#3b82f6');

// ─── Email 2: New Schedule Assigned ───
document.getElementById('email2').srcdoc = renderEmailTemplate('New Inspection Schedule',
    `<p style="margin:0 0 16px 0;">Dear <strong>Mel Santos</strong>,</p>
     <p style="margin:0 0 20px 0;">You have been assigned a new inspection schedule.</p>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;border-radius:8px;">
         <tr><td style="padding:16px 20px;">
             <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                 ${infoRow('Date', 'January 15, 2026')}
                 ${infoRow('Note', 'Focus on food handling areas')}
             </table>
         </td></tr></table>
     <p style="margin:20px 0 0 0;font-size:14px;color:#64748b;">Please log in to TayabasCare for full details.</p>`,
    '#1e40af');

// ─── Email 3: Schedule Updated ───
document.getElementById('email3').srcdoc = renderEmailTemplate('Schedule Updated',
    `<p style="margin:0 0 16px 0;">Dear <strong>Olive Cruz</strong>,</p>
     <p style="margin:0 0 20px 0;">Your inspection schedule has been updated.</p>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;border-radius:8px;">
         <tr><td style="padding:16px 20px;">
             <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                 ${infoRow('New Date', 'February 3, 2026')}
                 ${infoRow('Note', 'Rescheduled due to holiday')}
             </table>
         </td></tr></table>
     <p style="margin:20px 0 0 0;font-size:14px;color:#64748b;">Please log in to TayabasCare for full details.</p>`,
    '#f59e0b');

// ─── Email 4: Inspection Reminder ───
document.getElementById('email4').srcdoc = renderEmailTemplate('Inspection Reminder',
    `<p style="margin:0 0 16px 0;">Dear <strong>Michael Reyes</strong>,</p>
     <p style="margin:0 0 20px 0;">This is a reminder that you have an inspection scheduled <strong>tomorrow</strong>:</p>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#eff6ff;border-radius:8px;border-left:4px solid #3b82f6;">
         <tr><td style="padding:16px 20px;">
             <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                 ${infoRow('Date', 'January 12, 2026')}
                 ${infoRow('Establishment', 'Jollibee Tayabas')}
                 ${infoRow('Note', 'Annual sanitary inspection')}
             </table>
         </td></tr></table>
     <p style="margin:20px 0 0 0;">Please prepare accordingly and review the establishment details before your visit.</p>`,
    '#3b82f6');

// ─── Email 5: Daily Compliance Alert ───
document.getElementById('email5').srcdoc = renderEmailTemplate('Daily Compliance Alert',
    `<p style="margin:0 0 16px 0;">Dear <strong>City Health Officer</strong>,</p>
     <p style="margin:0 0 20px 0;">This is your daily compliance alert from TayabasCare.</p>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
         <tr><td style="background-color:#fef2f2;border-left:4px solid #dc2626;padding:12px 16px;border-radius:0 6px 6px 0;">
             <span style="font-size:15px;font-weight:700;color:#991b1b;">&#9888; High-Risk Establishments (3)</span>
         </td></tr></table>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
         ${listItem('Jollibee Tayabas (Score: 78, Barangay: Poblacion)')}
         ${listItem('Max Restaurant (Score: 72, Barangay: Ibabang Dupay)')}
         ${listItem('Bakeshop ni Juan (Score: 65, Barangay: Mayuha)')}
     </table>
     <p style="margin:0 0 20px 0;font-size:14px;color:#dc2626;font-weight:600;">These establishments require priority inspection.</p>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
         <tr><td style="background-color:#fef3c7;border-left:4px solid #f59e0b;padding:12px 16px;border-radius:0 6px 6px 0;">
             <span style="font-size:15px;font-weight:700;color:#92400e;">&#9888; Violation Threshold Alerts (2)</span>
         </td></tr></table>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px 0;">
         ${listItem('Jollibee Tayabas — 5 violations on record')}
         ${listItem('Max Restaurant — 3 violations on record')}
     </table>
     <p style="margin:0 0 20px 0;font-size:14px;color:#92400e;font-weight:600;">These establishments have 3+ violations and need corrective action.</p>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:0;">
         <tr><td style="background-color:#eff6ff;border-radius:8px;padding:14px 18px;font-size:14px;color:#1e40af;">
             &#128200; Please review these in the <strong>TayabasCare Dashboard</strong> for full details and action items.
         </td></tr></table>`,
    '#dc2626');

// ─── Email 6: Overdue Follow-up ───
document.getElementById('email6').srcdoc = renderEmailTemplate('Overdue Compliance Follow-up',
    `<p style="margin:0 0 16px 0;">Dear <strong>Wendy Dela Cruz</strong>,</p>
     <p style="margin:0 0 20px 0;">The compliance deadline for the following establishment has passed:</p>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fef2f2;border-radius:8px;border-left:4px solid #dc2626;">
         <tr><td style="padding:16px 20px;">
             <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                 ${infoRow('Establishment', 'Bakeshop ni Juan')}
                 ${infoRow('Deadline', 'January 5, 2026')}
                 ${infoRow('Days Overdue', '7 days')}
             </table>
         </td></tr></table>
     <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin:20px 0 0 0;">
         <tr><td style="background-color:#fef3c7;border-radius:8px;padding:14px 18px;font-size:14px;color:#92400e;">
             &#9888; Please follow up with the establishment and update the compliance status in TayabasCare as soon as possible.
         </td></tr></table>`,
    '#dc2626');
</script>

</body>
</html>
